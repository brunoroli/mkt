<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><link rel="stylesheet" href="../../../../marca/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden}
body.foto,body.navy{background:#131E2D;color:#fff;--sec:rgba(255,255,255,.62);--bar1:rgba(192,147,75,.75);--bar2:#FFFFFF;--hl:#C0934B}
body.claro{background:#FFFFFF;color:#131E2D;--sec:rgba(19,30,45,.55);--bar1:rgba(19,30,45,.22);--bar2:#131E2D;--hl:#C0934B}
body.dourado{background:#C0934B;color:#131E2D;--sec:rgba(19,30,45,.7);--bar1:rgba(19,30,45,.3);--bar2:#131E2D;--hl:#FFFFFF}
.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,30,45,.78) 0%,rgba(19,30,45,.25) 18%,rgba(19,30,45,.2) 32%,rgba(19,30,45,.82) 58%,rgba(19,30,45,.96) 100%)}
.z{position:relative;z-index:2}
.rotulo{position:absolute;top:84px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;font-size:20px;letter-spacing:5px;text-transform:uppercase;color:var(--sec);z-index:3}
.logo{width:150px;display:block}
.corpo{position:absolute;left:80px;right:80px;bottom:200px;z-index:3}
body.claro .corpo,body.dourado .corpo,body.navy .corpo{top:150px;bottom:190px;display:flex;flex-direction:column;justify-content:center}
.big{font-family:"Stretch Pro",Arial,sans-serif;line-height:.95;letter-spacing:.005em;display:flex;align-items:baseline;gap:28px;flex-wrap:wrap}
.big .n{font-size:190px}
.big .u{font-family:Arial,sans-serif;font-size:44px;color:var(--sec);letter-spacing:0}
.barras{margin-top:56px;display:grid;grid-template-columns:150px 1fr;row-gap:22px;align-items:center;font-size:26px}
.barras .l{color:var(--sec)}
.barras .b{display:flex;align-items:center;gap:20px;font-weight:700;font-size:28px}
.barras .b i{display:block;height:40px;background:var(--bar1)}
.barras .b.atual i{background:var(--bar2)}
.txt{margin-top:60px;font-size:40px;line-height:1.3}
.txt b{font-weight:700}
.txt .hl{color:var(--hl);font-weight:700}
body.claro .txt .hl{color:#131E2D;text-decoration:underline;text-decoration-color:#C0934B;text-decoration-thickness:4px;text-underline-offset:8px}
body.dourado .txt .hl{color:#131E2D;text-decoration:underline;text-decoration-color:#FFFFFF;text-decoration-thickness:4px;text-underline-offset:8px}
.rodape{position:absolute;left:80px;right:80px;bottom:72px;z-index:3;font-size:18px;letter-spacing:3px;text-transform:uppercase;color:var(--sec)}
.rodape .sec{display:flex;justify-content:space-between;align-items:center;margin-top:28px;letter-spacing:4px;font-size:20px;font-weight:700;color:inherit}
body.foto .rodape .sec,body.navy .rodape .sec{color:#fff}
body.claro .rodape .sec,body.dourado .rodape .sec{color:#131E2D}
.rodape .sec span{border-left:3px solid currentColor;padding-left:16px}
.ac{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;font-size:.98em}
</style>
<style>.bg{object-position:62% center}h1{font-family:"Stretch Pro",Arial,sans-serif;font-weight:400;font-size:66px;line-height:1.08;text-transform:uppercase}h1 em{font-style:normal;color:#C0934B}.sub{margin-top:36px;font-size:40px;line-height:1.25;color:rgba(255,255,255,.88)}.corpo{bottom:220px}</style></head><body class="foto">
<img class="bg" src="../imagens/orla-predios.webp" alt=""><div class="ov"></div>
<div class="rotulo"><span>Itapoá · Mercado imobiliário</span><img class="logo" src="../../../../marca/logo-b3g-empreendimentos-negativo.png" alt="B3G Empreendimentos"></div>
<div class="corpo"><h1>A cidade das casas de praia est<span class="ac">á</span> <em>subindo</em></h1><p class="sub">Por que Itapoá começou a crescer para cima</p></div>
<div class="rodape">Itapoá, SC · Foto: B3G Empreendimentos<div class="sec"><span>Leitura de mercado</span><span style="border:0">B3G Empreendimentos</span></div></div>
</body></html>
