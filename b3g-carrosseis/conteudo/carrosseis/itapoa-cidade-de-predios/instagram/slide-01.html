<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../../../marca/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#131E2D;color:#fff;font-family:Archivo,sans-serif;position:relative;overflow:hidden}
.topo{position:absolute;top:96px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:baseline}
.tag{font-size:22px;font-weight:400;letter-spacing:6px;text-transform:uppercase;color:#C0934B}
.marca{font-size:22px;font-weight:500;letter-spacing:6px;text-transform:uppercase;color:rgba(255,255,255,.85)}
.marca span{font-weight:300;color:rgba(255,255,255,.6)}
.skyline{position:absolute;right:80px;top:260px;width:360px;height:300px}
.conteudo{position:absolute;left:80px;right:80px;bottom:190px}
h1{font-weight:200;font-size:116px;line-height:.92;letter-spacing:-.015em}
h1 em{font-style:normal;color:#C0934B;font-weight:300}
.sub{margin-top:36px;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:54px;line-height:1.05;color:rgba(255,255,255,.78)}
.regua{width:96px;height:1px;background:#C0934B;margin-bottom:56px}
.progresso{position:absolute;left:0;bottom:0;height:3px;width:20%;background:#fff}
</style></head><body>
<div class="topo"><span class="tag">Itapoá · 2026</span><span class="marca">B3G <span>Empreendimentos</span></span></div>
<svg class="skyline" viewBox="0 0 360 300" aria-hidden="true">
  <g stroke="#C0934B" stroke-width="1.2" fill="none" opacity=".55">
    <line x1="20" y1="300" x2="20" y2="262"/>
    <line x1="88" y1="300" x2="88" y2="214"/>
    <line x1="156" y1="300" x2="156" y2="160"/>
    <line x1="224" y1="300" x2="224" y2="104"/>
    <line x1="292" y1="300" x2="292" y2="48"/>
    <line x1="352" y1="300" x2="352" y2="0"/>
  </g>
</svg>
<div class="conteudo">
  <div class="regua"></div>
  <h1>A cidade das casas de praia está <em>subindo</em></h1>
  <p class="sub">Por que Itapoá começou a crescer para cima</p>
</div>
<div class="progresso"></div>
</body></html>
