<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../../../marca/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#131E2D;color:#fff;font-family:Archivo,sans-serif;position:relative;overflow:hidden}
.capa-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% center}
.capa-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,20,31,.75) 0%,rgba(12,20,31,.35) 12%,rgba(12,20,31,.05) 24%,rgba(12,20,31,.15) 45%,rgba(12,20,31,.78) 68%,rgba(12,20,31,.96) 100%)}
.topo{position:absolute;top:96px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:baseline;z-index:5}
.tag{font-size:22px;font-weight:500;letter-spacing:6px;text-transform:uppercase;color:#fff}
.marca{font-size:22px;font-weight:500;letter-spacing:6px;text-transform:uppercase;color:#fff}
.marca span{font-weight:300;color:rgba(255,255,255,.75)}
.conteudo{position:absolute;left:80px;right:80px;bottom:160px;z-index:5}
h1{font-weight:200;font-size:116px;line-height:.92;letter-spacing:-.015em;text-shadow:0 2px 30px rgba(0,0,0,.25)}
h1 em{font-style:normal;color:#C0934B;font-weight:300}
.sub{margin-top:36px;font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:300;font-size:54px;line-height:1.05;color:rgba(255,255,255,.85)}
.regua{width:96px;height:1px;background:#C0934B;margin-bottom:48px}
.progresso{position:absolute;left:0;bottom:0;height:3px;width:20%;background:#fff;z-index:5}
</style></head><body>
<img class="capa-bg" src="../imagens/orla-predios.webp" alt="">
<div class="capa-overlay"></div>
<div class="topo"><span class="tag">Itapoá · 2026</span><span class="marca">B3G <span>Empreendimentos</span></span></div>
<div class="conteudo">
  <div class="regua"></div>
  <h1>A cidade das casas de praia está <em>subindo</em></h1>
  <p class="sub">Por que Itapoá começou a crescer para cima</p>
</div>
<div class="progresso"></div>
</body></html>
