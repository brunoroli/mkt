<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="UTF-8">
<link rel="stylesheet" href="../../../../marca/fonts/fonts.css">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px}
body{background:#131E2D;color:#fff;font-family:Arial,Helvetica,sans-serif;position:relative;overflow:hidden}
.capa-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:62% center}
.capa-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(19,30,45,.8) 0%,rgba(19,30,45,.35) 13%,rgba(19,30,45,.05) 26%,rgba(19,30,45,.15) 45%,rgba(19,30,45,.8) 66%,rgba(19,30,45,.97) 100%)}
.topo{position:absolute;top:84px;left:80px;right:80px;display:flex;justify-content:space-between;align-items:center;z-index:5}
.tag{font-size:22px;letter-spacing:6px;text-transform:uppercase;color:#fff}
.logo{width:190px;display:block}
.conteudo{position:absolute;left:80px;right:80px;bottom:150px;z-index:5}
h1{font-family:"Stretch Pro",Arial,sans-serif;font-weight:400;font-size:66px;line-height:1.08;letter-spacing:.01em;text-transform:uppercase}
h1 em{font-style:normal;color:#C0934B}
.ac{font-family:Archivo,sans-serif;font-stretch:125%;font-weight:900;font-size:.98em}
.sub{margin-top:40px;font-size:40px;line-height:1.25;color:rgba(255,255,255,.88)}
.progresso{position:absolute;left:0;bottom:0;height:3px;width:20%;background:#fff;z-index:5}
</style></head><body>
<img class="capa-bg" src="../imagens/orla-predios.webp" alt="">
<div class="capa-overlay"></div>
<div class="topo"><span class="tag">Itapoá · 2026</span><img class="logo" src="../../../../marca/logo-b3g-empreendimentos-negativo.png" alt="B3G Empreendimentos"></div>
<div class="conteudo">
  <h1>A cidade das casas de praia est<span class="ac">á</span> <em>subindo</em></h1>
  <p class="sub">Por que Itapoá começou a crescer para cima</p>
</div>
<div class="progresso"></div>
</body></html>
